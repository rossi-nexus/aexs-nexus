# Holder Supabase-prosjektet (gratisnivå) våkent. Free tier pauser etter 7 dager uten trafikk;
# 30.09.2026 sovnet nexus-production og innlogging sluttet å virke. Denne pinger REST + auth daglig.
name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'   # daglig 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST + Auth
        env:
          SB_URL: https://plnwneqqbmtwoaaeirta.supabase.co
          SB_ANON: sb_publishable_iRVZPhnQ3M0rco6_76MMTQ_nw4maye0
        run: |
          set -e
          curl -fsS "$SB_URL/rest/v1/ontology_categories?select=id&limit=1" -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" -o /dev/null
          curl -fsS "$SB_URL/auth/v1/health" -H "apikey: $SB_ANON" -o /dev/null
          echo "alive $(date -u)"
